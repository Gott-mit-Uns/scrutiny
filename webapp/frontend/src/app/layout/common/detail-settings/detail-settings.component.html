<h2 mat-dialog-title>Scrutiny 设置</h2>
<mat-dialog-content class="mat-typography">

    <form class="flex flex-col p-8 pb-0 ">
        <div class="flex flex-col gt-xs:flex-row">
            <mat-form-field class="flex-auto gt-xs:pr-3">
                <mat-label>阈值数据来源</mat-label>
                <mat-select [value]="'scrutiny'">
                    <mat-option  value="scrutiny">Scrutiny</mat-option>
                    <mat-option value="name" disabled>硬盘厂商</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="flex flex-col gt-xs:flex-row">
            <mat-form-field class="flex-auto gt-xs:pr-3">
                <mat-label>通知</mat-label>
                <mat-select [value]="'enable'">
                    <mat-option  value="enable">启用</mat-option>
                    <mat-option value="disable" disabled>禁用</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </form>

</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>取消</button>
    <button mat-button matTooltip="暂未实现" [mat-dialog-close]="true" cdkFocusInitial>保存</button>
</mat-dialog-actions>
