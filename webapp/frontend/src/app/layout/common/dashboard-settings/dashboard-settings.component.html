<h2 mat-dialog-title>Scrutiny 设置</h2>
<mat-dialog-content class="mat-typography">

    <div class="flex flex-col p-8 pb-0 overflow-hidden">
        <div class="flex flex-col mt-5 gt-md:flex-row">

            <mat-form-field class="flex-auto gt-xs:pr-3 gt-md:pr-3">
                <mat-label>外观模式</mat-label>
                <mat-select [(ngModel)]="theme">
                    <mat-option value="system">跟随系统</mat-option>
                    <mat-option value="dark">深色</mat-option>
                    <mat-option value="light">浅色</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="flex flex-col mt-5 gt-md:flex-row">
            <mat-form-field class="flex-auto gt-xs:pr-3 gt-md:pr-3">
                <mat-label>硬盘标题</mat-label>
                <mat-select [(ngModel)]="dashboardDisplay">
                    <mat-option value="name">型号名称</mat-option>
                    <mat-option value="serial_id">序列号</mat-option>
                    <mat-option value="uuid">UUID</mat-option>
                    <mat-option value="label">自定义标签</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field class="flex-auto gt-xs:pr-3 gt-md:pl-3">
                <mat-label>排序方式</mat-label>
                <mat-select [(ngModel)]="dashboardSort">
                    <mat-option value="status">状态</mat-option>
                    <mat-option value="title">标题</mat-option>
                    <mat-option value="age">最近更新时间</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="flex flex-col mt-5 gt-md:flex-row">
            <mat-form-field class="flex-auto gt-xs:pr-3 gt-md:pr-3">
                <mat-label>温度单位</mat-label>
                <mat-select [(ngModel)]="temperatureUnit">
                    <mat-option value="celsius">摄氏度</mat-option>
                    <mat-option value="fahrenheit">华氏度</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field class="flex-auto gt-xs:pr-3 gt-md:pr-3">
                <mat-label>容量单位</mat-label>
                <mat-select [(ngModel)]="fileSizeSIUnits">
                    <mat-option [value]=true>十进制单位（GB）</mat-option>
                    <mat-option [value]=false>二进制单位（GiB）</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="flex flex-col mt-5 gt-md:flex-row">
            <mat-form-field class="flex-auto gt-xs:pr-3 gt-md:pr-3">
                <mat-label>通电时间格式</mat-label>
                <mat-select [(ngModel)]="poweredOnHoursUnit">
                    <mat-option value="humanize">易读格式</mat-option>
                    <mat-option value="device_hours">累计小时</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field class="flex-auto gt-xs:pr-3 gt-md:pr-3">
                <mat-label>图表线条</mat-label>
                <mat-select [(ngModel)]="lineStroke">
                    <mat-option value="smooth">平滑曲线</mat-option>
                    <mat-option value="straight">直线</mat-option>
                    <mat-option value="stepline">阶梯线</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="flex flex-col mt-5 gt-md:flex-row">
            <mat-form-field class="flex-auto gt-xs:pr-3 gt-md:pr-3">
                <mat-label>硬盘状态判定依据</mat-label>
                <mat-select [(ngModel)]=statusThreshold>
                    <mat-option [value]=1>SMART 厂商阈值</mat-option>
                    <mat-option [value]=2>Scrutiny</mat-option>
                    <mat-option [value]=3>两者同时</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="flex flex-col mt-5 gt-md:flex-row">
            <mat-form-field class="flex-auto gt-xs:pr-3 gt-md:pr-3">
                <mat-label>通知属性范围</mat-label>
                <mat-select [(ngModel)]=statusFilterAttributes>
                    <mat-option [value]=0>全部</mat-option>
                    <mat-option [value]=1>仅关键属性</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="flex flex-col mt-5 gt-md:flex-row">
            <mat-form-field class="flex-auto gt-xs:pr-3 gt-md:pr-3">
                <mat-label>重复通知</mat-label>
                <mat-select [(ngModel)]=repeatNotifications>
                    <mat-option [value]=true>始终通知</mat-option>
                    <mat-option [value]=false>仅在数值变化时通知</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="mt-6 mb-2">
            <h3 class="text-lg font-medium">兼容性选项</h3>
            <div class="w-full border-b mt-1"></div>
        </div>

        <div class="flex flex-col mt-5 gt-md:flex-row">
            <mat-form-field class="flex-auto gt-xs:pr-3 gt-md:pr-3"
                matTooltip="丢弃从 SMART 命令传输（SCT）数据表读取的历史温度。部分硬盘的这项数据可能不准确；当前温度仍会正常保存。"
                matTooltipPosition="right">
                <mat-label>丢弃 SCT 历史温度</mat-label>
                <mat-select [(ngModel)]=discardSCTTempHistory>
                    <mat-option [value]=true>启用</mat-option>
                    <mat-option [value]=false>禁用</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </div>

</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>取消</button>
    <button mat-button mat-dialog-close (click)="saveSettings()" cdkFocusInitial>保存</button>
</mat-dialog-actions>
