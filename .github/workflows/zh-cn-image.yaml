name: Build Simplified Chinese image

on:
  push:
    branches:
      - agent/zh-cn-v0.9.2
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.zh-CN
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gott-mit-uns/scrutiny:v0.9.4-zh-cn
          labels: |
            org.opencontainers.image.source=https://github.com/Gott-mit-Uns/scrutiny
            org.opencontainers.image.version=v0.9.4-zh-cn
            org.opencontainers.image.description=Scrutiny v0.9.4 Simplified Chinese frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published Chinese image
        run: |
          image=ghcr.io/gott-mit-uns/scrutiny:v0.9.4-zh-cn
          docker pull "$image"
          docker run --rm --entrypoint /bin/sh "$image" -ec '
            test -x /opt/scrutiny/web
            test -r /opt/scrutiny/web/index.html
            grep -q "lang=\"zh-CN\"" /opt/scrutiny/web/index.html
            grep -q "Scrutiny 硬盘健康监控" /opt/scrutiny/web/index.html
          '
